name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docker/frontend/**"
      - "kubernetes/frontend/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: employeeacrmanish001
  ACR_LOGIN_SERVER: employeeacrmanish001.azurecr.io
  IMAGE_NAME: employee-frontend
  AKS_RESOURCE_GROUP: employee-management-rg
  AKS_CLUSTER_NAME: employee-aks
  K8S_NAMESPACE: employee-management

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build frontend image
        run: |
          docker build \
            -f docker/frontend/Dockerfile \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push frontend image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $AKS_RESOURCE_GROUP \
            --name $AKS_CLUSTER_NAME \
            --admin \
            --overwrite-existing

      - name: Deploy new frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            -n $K8S_NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n $K8S_NAMESPACE \
            --timeout=180s
